name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-analyze:
    runs-on: windows-latest

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install SonarQube Cloud scanner
        shell: powershell
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore dependencies
        run: dotnet restore HotelBooking.sln

      - name: Start SonarQube analysis
        shell: powershell
        run: dotnet-sonarscanner begin /k:"HugoNechai_HotelBooking_Clean_Async" /o:"hugonechai" /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Build
        run: dotnet build HotelBooking.sln --no-restore

      - name: Run unit tests
        run: dotnet test HotelBooking.UnitTests/HotelBooking.UnitTests.csproj --no-build

      - name: Finish SonarQube analysis
        shell: powershell
        run: dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"